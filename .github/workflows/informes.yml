name: Subir informes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  informes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        carpeta: [propuesta]
        include:
          - carpeta: propuesta
            nombre: Plan de Trabajo - Tesis de Grado de Ingeniería Electrónica - Juan Ignacio Biancuzzo
    steps:
      - name: Conseguir repo en la rama correspondiente
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Crear el pdf
        uses: addnab/docker-run-action@v3
        timeout-minutes: 5
        with:
          image: juanbiancuzzo/latex:latest
          options: -v ${{ github.workspace }}/${{ matrix.carpeta }}:/latex
          run: sh -c "/scripts/compile.sh && cp /latex/main.pdf '/latex/${{ matrix.nombre }}.pdf'"

      - name: Subir pdf a github artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nombre }}
          path: ${{ github.workspace }}/${{ matrix.carpeta }}/${{ matrix.nombre }}.pdf
          if-no-files-found: warn

  release:
    needs: informes
    runs-on: ubuntu-latest

    steps:
      - name: Descargar artifact de los pdfs
        uses: actions/download-artifact@v4

      - name: Subir artifact como release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: informe
          name: "Release informe"
          files: |
            **/*.pdf
